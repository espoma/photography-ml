services:
  # Database Service
  db:
    image: pgvector/pgvector:pg16 # PostgreSQL 16 with pgvector extension pre-installed
    container_name: photography_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: photography_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:
