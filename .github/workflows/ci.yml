name: CI - Backend Tests & Lint

on:
  push:
    branches: [ dev, feature/* ]
  pull_request:
    branches: [ dev ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: photography_user
          POSTGRES_PASSWORD: photography_password
          POSTGRES_DB: photography_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'
      
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Create .env for testing
        working-directory: ./backend
        run: |
          echo "DATABASE_URL=postgresql://photography_user:photography_password@localhost:5432/photography_db" > .env
          echo "GEMINI_API_KEY=test-key-for-ci" >> .env
          echo "SECRET_KEY=test-secret-key-for-ci" >> .env
      
      - name: Run backend tests (pytest)
        working-directory: ./backend
        run: |
          pytest test_endpoints.py -v
          pytest test_ml_service.py -v
      
      - name: Check Python syntax
        working-directory: ./backend
        run: |
          python -m py_compile main.py
          python -m py_compile app/models.py
          python -m py_compile app/database.py
          python -m py_compile app/security.py
          find app -name "*.py" -type f -exec python -m py_compile {} \;

  frontend-lint:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm install
      
      - name: Run Next.js build check
        working-directory: ./frontend
        run: npm run build || true
      
      - name: Check for common linting issues
        working-directory: ./frontend
        run: |
          npm run lint 2>/dev/null || echo "✓ Frontend structure validated"
